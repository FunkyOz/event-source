version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # The library has no lock file: only open a PR when a new release is outside the allowed range
    versioning-strategy: widen
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
