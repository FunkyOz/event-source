name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catch breakages from new dependency releases, since the library has no lock file
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Code style
        run: composer cs:check

      - name: Rector
        run: composer rector:check

      - name: PHPStan
        run: composer tests:types

  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: composer tests:unit

  dependency-sets:
    name: ${{ matrix.name }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core has no dependencies: check it works without any framework installed
          - name: No framework
            php: '8.2'
            remove: orchestra/testbench symfony/http-foundation
            suites: core
          - name: No framework
            php: '8.5'
            remove: orchestra/testbench symfony/http-foundation
            suites: core
          # Laravel needs Symfony 7+, so Symfony 6.4 is only tested here
          - name: Symfony 6.4 only
            php: '8.2'
            remove: orchestra/testbench
            require: symfony/http-foundation:6.4.*
            suites: core,symfony
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Change the development dependencies
        run: |
          composer remove --dev --no-update ${{ matrix.remove }}
          if [ -n "${{ matrix.require }}" ]; then composer require --dev --no-update ${{ matrix.require }}; fi

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite ${{ matrix.suites }}

  mutation:
    name: Coverage and mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Coverage
        run: composer tests:coverage

      - name: Infection
        run: composer tests:mutation

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-and-mutation-reports
          path: build/
          if-no-files-found: ignore
